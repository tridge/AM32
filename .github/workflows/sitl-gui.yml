name: SITL GUI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # drive the GUI headlessly over its control socket against a real
  # SITL: exercises the panels, the model builder and the launcher
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 \
                                  libdbus-1-3 libxcb-cursor0
          python3 -m pip install -r Mcu/SITL/requirements.txt

      - name: Build SITL
        run: make AM32_SITL_CAN

      - name: Betaflight motor integration
        run: python3 Mcu/SITL/betaflight_sitl_test.py

      - name: Headless GUI test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 Mcu/SITL/gui_ci_test.py --gui-python python3

      - name: MSP, Windows packaging and USB protocol regressions
        run: python3 -m unittest discover -s Mcu/SITL -p 'test_*.py' -v

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
          python3 -m pip install -r Mcu/SITL/requirements.txt pyinstaller
      - name: Build SITL and GUI
        run: |
          make AM32_SITL_CAN
          python3 Mcu/SITL/build_sitl_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: am32-sitl-gui-linux
          path: dist/am32-sitl-gui

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make python3 git
      - name: Build firmware, bootloader and Windows package
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          python3 Mcu/SITL/build_win11.py --local --python "$(cygpath -u "$NATIVE_PYTHON")"
      # Upload the common staging directory: GitHub's downloadable artifact
      # ZIP contains exactly the files in the ZIP produced on win11, without
      # wrapping another ZIP inside it.
      - uses: actions/upload-artifact@v4
        with:
          name: am32-sitl-gui-windows
          path: dist/windows-package/
          if-no-files-found: error
